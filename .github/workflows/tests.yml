name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  BASE_URL: https://schedule-latest-pz3d.onrender.com

jobs:
  unit-tests:
    name: Unit Tests / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit placeholder
        run: echo "No separate unit tests configured."

  api-tests:
    name: API Tests Newman
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection
        run: |
          newman run tests/api/postman/Schedule_API_Tests.postman_collection.json \
            -e tests/api/postman/schedule-local.postman_environment.json \
            --env-var "baseUrl=$BASE_URL" \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-report.html

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.html

  e2e-tests:
    name: E2E Tests Playwright
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: npx playwright test tests/e2e/specs --project=chromium --workers=1 --grep-invert "database"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  db-tests:
    name: SQL Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Prepare database schema
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d appdb -c "
          CREATE TABLE IF NOT EXISTS groups (
            id SERIAL PRIMARY KEY,
            title VARCHAR(35),
            disable BOOLEAN DEFAULT false
          );"

      - name: Run DB tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/appdb
        run: npx playwright test tests/e2e/specs/group.spec.js --project=chromium --workers=1 --grep "database"

      - name: Upload DB Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-playwright-report
          path: playwright-report/