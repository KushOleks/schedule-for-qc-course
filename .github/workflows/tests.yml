name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  BASE_URL: http://localhost:8080
  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/appdb

jobs:
  unit-tests:
    name: Unit Tests / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test -- --watchAll=false src/helper

  api-tests:
    name: API Tests Jest
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:8080 > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 5
          done

          echo "Application did not start in time"
          docker compose ps
          docker compose logs app
          docker compose logs postgres
          docker compose logs redis
          exit 1

      - name: Run API tests
        env:
          BASE_URL: http://localhost:8080
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/appdb
        run: npm run test:api

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop application
        if: always()
        run: docker compose down -v

  e2e-tests:
    name: E2E Tests Playwright
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:8080 > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 5
          done

          echo "Application did not start in time"
          docker compose ps
          docker compose logs app
          docker compose logs postgres
          docker compose logs redis
          exit 1

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:8080
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop application
        if: always()
        run: docker compose down -v

  db-tests:
    name: SQL Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare database schema
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d appdb -c "
          CREATE TABLE IF NOT EXISTS groups (
            id SERIAL PRIMARY KEY,
            title VARCHAR(35),
            disable BOOLEAN DEFAULT false
          );"

      - name: Run DB tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/appdb
        run: npm run test:db

      - name: Upload DB Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-playwright-report
          path: playwright-report/
          if-no-files-found: ignore