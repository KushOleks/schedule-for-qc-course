services:
  app:
    build: .
    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/appdb
      DB_USER: postgres
      DB_PASSWORD: postgres

      JWT_SECRET: dev-secret
      JWT_EXPIRED: 24h

      REDIS_URL: redis://redis:6379
      BACKEND_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:3000
      PORT: 8080

      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: dummy
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: dummy

      FACEBOOK_CLIENT_ID: dummy
      FACEBOOK_CLIENT_SECRET: dummy

      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: dummy
      MAIL_PASSWORD: dummy

      HIBERNATE_SHOW_SQL: false

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: